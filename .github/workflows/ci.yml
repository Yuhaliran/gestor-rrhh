# Integración continua (tarea 3b): compilación, formato y pruebas en cada PR a main.
# Los jobs «Build, pruebas y formato» y «Frontend: lint, pruebas y build» (tarea 34) son checks
# obligatorios en el ruleset de main. Corren siempre: un check obligatorio salteado bloquea el merge.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build, pruebas y formato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # --locked-mode falla si algún packages.lock.json no coincide con los proyectos (E-008).
      - name: Restaurar paquetes
        run: dotnet restore --locked-mode

      - name: Compilar
        run: dotnet build --no-restore

      # dotnet-ef con la versión fijada en dotnet-tools.json.
      - name: Restaurar herramientas
        run: dotnet tool restore

      # MIG1: falla si el modelo cambió y falta su migración.
      - name: Migraciones al día (MIG1)
        run: dotnet ef migrations has-pending-model-changes -p src/RRHH.Infrastructure -s src/RRHH.Api --no-build

      - name: Verificar formato
        run: dotnet format --verify-no-changes --no-restore

      - name: Pruebas
        run: dotnet test --no-build --filter "Categoria!=E2E&Categoria!=SqlServer"

  frontend:
    name: "Frontend: lint, pruebas y build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci falla si package-lock.json no coincide con package.json (como --locked-mode)
      - name: Instalar dependencias
        run: npm ci

      - name: Lint (incluye las reglas ARQF1 a ARQF3)
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
