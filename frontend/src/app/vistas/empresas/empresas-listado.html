<div class="encabezado-pantalla">
  <h2>Empresas</h2>
  <a matButton="filled" routerLink="/empresas/nuevo">Nuevo</a>
</div>

<rrhh-listado-paginado [listado]="listado">
  <table mat-table [dataSource]="listado.elementos()">
    <ng-container matColumnDef="nombreComercial">
      <th mat-header-cell *matHeaderCellDef>Nombre comercial</th>
      <td mat-cell *matCellDef="let empresa">{{ empresa.nombreComercial }}</td>
    </ng-container>
    <ng-container matColumnDef="nit">
      <th mat-header-cell *matHeaderCellDef>NIT</th>
      <td mat-cell *matCellDef="let empresa">{{ empresa.nit }}</td>
    </ng-container>
    <ng-container matColumnDef="municipio">
      <th mat-header-cell *matHeaderCellDef>Municipio</th>
      <td mat-cell *matCellDef="let empresa">{{ empresa.municipioNombre }}</td>
    </ng-container>
    <ng-container matColumnDef="departamento">
      <th mat-header-cell *matHeaderCellDef>Departamento</th>
      <td mat-cell *matCellDef="let empresa">{{ empresa.departamentoNombre }}</td>
    </ng-container>
    <ng-container matColumnDef="pais">
      <th mat-header-cell *matHeaderCellDef>País</th>
      <td mat-cell *matCellDef="let empresa">{{ empresa.paisNombre }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef><span class="oculto">Acciones</span></th>
      <td mat-cell *matCellDef="let empresa" class="acciones">
        <a matButton [routerLink]="['/empresas', empresa.id, 'colaboradores']">Colaboradores</a>
        <a matButton [routerLink]="['/empresas', empresa.id, 'editar']">Editar</a>
        <button matButton type="button" (click)="eliminacion.eliminar(empresa)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  </table>
</rrhh-listado-paginado>
