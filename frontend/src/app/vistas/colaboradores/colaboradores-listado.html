<div class="encabezado-pantalla">
  <h2>Colaboradores</h2>
  <a matButton="filled" routerLink="/colaboradores/nuevo">Nuevo</a>
</div>

<rrhh-listado-paginado [listado]="listado">
  <table mat-table [dataSource]="listado.elementos()">
    <ng-container matColumnDef="nombreCompleto">
      <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
      <td mat-cell *matCellDef="let colaborador">{{ colaborador.nombreCompleto }}</td>
    </ng-container>
    <ng-container matColumnDef="correo">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let colaborador">{{ colaborador.correo }}</td>
    </ng-container>
    <ng-container matColumnDef="edad">
      <th mat-header-cell *matHeaderCellDef>Edad</th>
      <td mat-cell *matCellDef="let colaborador">{{ textoEdad(colaborador.edad) }}</td>
    </ng-container>
    <ng-container matColumnDef="empresas">
      <th mat-header-cell *matHeaderCellDef>Empresas</th>
      <td mat-cell *matCellDef="let colaborador">{{ empresas(colaborador) }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef><span class="oculto">Acciones</span></th>
      <td mat-cell *matCellDef="let colaborador" class="acciones">
        <a matButton [routerLink]="['/colaboradores', colaborador.id]">Ver detalle</a>
        <a matButton [routerLink]="['/colaboradores', colaborador.id, 'editar']">Editar</a>
        <button matButton type="button" (click)="eliminacion.eliminar(colaborador)">
          Eliminar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  </table>
</rrhh-listado-paginado>
