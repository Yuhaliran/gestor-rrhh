<div class="encabezado-pantalla">
  <h2>Municipios</h2>
  <a matButton="filled" routerLink="/municipios/nuevo">Nuevo</a>
</div>

<rrhh-listado-paginado [listado]="listado">
  <table mat-table [dataSource]="listado.elementos()">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let municipio">{{ municipio.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="departamento">
      <th mat-header-cell *matHeaderCellDef>Departamento</th>
      <td mat-cell *matCellDef="let municipio">{{ municipio.departamentoNombre }}</td>
    </ng-container>
    <ng-container matColumnDef="pais">
      <th mat-header-cell *matHeaderCellDef>País</th>
      <td mat-cell *matCellDef="let municipio">{{ municipio.paisNombre }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef><span class="oculto">Acciones</span></th>
      <td mat-cell *matCellDef="let municipio" class="acciones">
        <a matButton [routerLink]="['/municipios', municipio.id, 'editar']">Editar</a>
        <button matButton type="button" (click)="eliminacion.eliminar(municipio)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
  </table>
</rrhh-listado-paginado>
